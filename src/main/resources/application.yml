spring:
  application:
    name: knock-api
  profiles:
    default: local
  config:
    # ???? ??? .env (KEY=VALUE, git ??) ? ??? ???. ?? ???.
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      # ???? Liquibase ? ????. Hibernate ? ??? ??.
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  servlet:
    context-path: /knock
  port: ${SERVER_PORT:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true